<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ECharts 柱状图模板(svg 渲染器,PNG/PDF 友好)</title>
  <!-- ECharts 5 — UMD 全局变量 echarts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body { margin: 0; padding: 24px; font-family: -apple-system, sans-serif; background: #fff; }
    #chart { width: 800px; height: 500px; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    // 关键:用 svg 渲染器 → PNG 截图清晰、PDF 矢量
    // PDF 交付必须用 svg;canvas 模式在 PDF 里会栅格化
    const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'svg' });

    // 修改这里的 option 即可换图表
    const option = {
      title: { text: '月度销售柱状图', left: 'center' },
      tooltip: { trigger: 'axis' },
      xAxis: {
        type: 'category',
        data: ['1月', '2月', '3月', '4月', '5月', '6月']
      },
      yAxis: { type: 'value', name: '万元' },
      series: [{
        name: '销售额',
        type: 'bar',
        data: [120, 200, 150, 80, 70, 110],
        itemStyle: { color: '#2563EB' }
      }]
    };

    chart.setOption(option);

    // 截图时确保图表已渲染完成
    window.addEventListener('load', () => {
      chart.resize();
    });
  </script>
</body>
</html>
