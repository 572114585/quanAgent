<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Shadertoy WebGL Boilerplate</title>
  <!--
    Shadertoy 无官方 CDN — 这是最小 WebGL2 boilerplate
    使用流程:
    1. 访问 https://www.shadertoy.com/browse 找到喜欢的效果
    2. 复制右侧 fragment shader 代码(可能多 tab,每个 tab 是一个 pass)
    3. 把 mainImage 函数体粘贴到下面的 FRAGMENT_SHADER 字符串里
    4. 适配 Shadertoy 内置 uniform:iTime / iResolution / iMouse
  -->
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById('gl-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const gl = canvas.getContext('webgl2');
    if (!gl) { console.error('WebGL2 not supported'); }

    // ── Vertex Shader(固定,无需修改) ─────────────────
    const VS = `#version 300 es
    in vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }`;

    // ── Fragment Shader(粘贴 Shadertoy 的 mainImage) ──
    const FS = `#version 300 es
    precision highp float;
    uniform float iTime;
    uniform vec2 iResolution;
    uniform vec2 iMouse;
    out vec4 fragColor;

    // TODO: 把 Shadertoy 的 mainImage 函数粘贴到这里
    // 示例:流动渐变(可删除,替换为你自己的)
    void mainImage(out vec4 fragColor, in vec2 fragCoord) {
      vec2 uv = fragCoord / iResolution.xy;
      vec3 col = 0.5 + 0.5 * cos(iTime + uv.xyx + vec3(0.0, 2.0, 4.0));
      fragColor = vec4(col, 1.0);
    }

    void main() {
      mainImage(fragColor, gl_FragCoord.xy);
    }`;

    // ── 编译链 ─────────────────────────────────────
    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, VS));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(program);
    gl.useProgram(program);

    // 全屏四边形(两个三角形)
    const positions = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
    const posLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    // uniform 位置
    const iTimeLoc = gl.getUniformLocation(program, 'iTime');
    const iResLoc = gl.getUniformLocation(program, 'iResolution');
    const iMouseLoc = gl.getUniformLocation(program, 'iMouse');

    // 鼠标位置
    let mouse = [0, 0];
    window.addEventListener('mousemove', e => {
      mouse = [e.clientX, canvas.height - e.clientY];
    });

    // 渲染循环
    const startTime = performance.now();
    function render() {
      const time = (performance.now() - startTime) / 1000;
      gl.uniform1f(iTimeLoc, time);
      gl.uniform2f(iResLoc, canvas.width, canvas.height);
      gl.uniform2f(iMouseLoc, mouse[0], mouse[1]);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    render();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
    });
  </script>
</body>
</html>
