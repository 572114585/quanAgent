<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Matter.js 2D 物理引擎模板(落球 + 鼠标拖拽)</title>
  <!-- Matter.js 0.20 UMD 全局变量 Matter -->
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #1a1a1a; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <script>
    const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;

    // 引擎
    const engine = Engine.create();
    const world = engine.world;

    // 渲染器
    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: 800,
        height: 500,
        wireframes: false,
        background: '#1a1a1a'
      }
    });
    Render.run(render);

    // 运行器
    const runner = Runner.create();
    Runner.run(runner, engine);

    // 边界(地面 + 左右墙 + 天花板)
    const walls = [
      Bodies.rectangle(400, 490, 800, 20, { isStatic: true }),  // 地面
      Bodies.rectangle(10, 250, 20, 500, { isStatic: true }),   // 左墙
      Bodies.rectangle(790, 250, 20, 500, { isStatic: true }),  // 右墙
      Bodies.rectangle(400, 10, 800, 20, { isStatic: true })    // 天花板
    ];
    Composite.add(world, walls);

    // 几个落球(不同颜色)
    const colors = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6'];
    const balls = [];
    for (let i = 0; i < 5; i++) {
      const ball = Bodies.circle(150 + i * 100, 100, 25, {
        restitution: 0.8,  // 弹性 0-1
        friction: 0.1,
        render: { fillStyle: colors[i] }
      });
      balls.push(ball);
    }
    Composite.add(world, balls);

    // 鼠标交互(可拖拽球)
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: {
        stiffness: 0.2,
        render: { visible: false }
      }
    });
    Composite.add(world, mouseConstraint);
    render.mouse = mouse;
  </script>
</body>
</html>
